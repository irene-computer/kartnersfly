# fly.toml app configuration file generated for kartnersfly on 2026-09-29T20:46:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kartnersfly'
primary_region = 'ams'

[build]

[env]
  PORT = "8080"
  DATABASE = "/data/database.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "kta_data"
  destination = "/data"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
