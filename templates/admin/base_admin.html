<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Kartners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --violet-primary: #8B5CF6;
            --violet-dark: #6B3FA0;
            --blue-primary: #3B82F6;
            --blue-dark: #1E3A8A;
        }
        
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .admin-header {
            background: linear-gradient(135deg, var(--violet-dark), var(--blue-dark));
            color: white;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        
        .admin-header .container-fluid {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .admin-header .logo img {
            height: 40px;
        }
        
        .admin-header .logo span {
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .admin-nav {
            background: white;
            padding: 70px 0 0 0;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }
        
        .admin-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .admin-nav li a {
            display: block;
            padding: 12px 20px;
            color: #4A5568;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .admin-nav li a:hover,
        .admin-nav li a.active {
            background: #F3E8FF;
            color: var(--violet-primary);
            border-left-color: var(--violet-primary);
        }
        
        .admin-nav li a i {
            width: 25px;
            margin-right: 10px;
        }
        
        .admin-content {
            margin-left: 250px;
            padding: 80px 30px 30px 30px;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }
        
        @media (max-width: 768px) {
            .admin-nav {
                width: 100%;
                height: auto;
                position: relative;
                padding-top: 60px;
            }
            .admin-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="admin-header">
    <div class="container-fluid">
        <div class="logo">
            <img src="/static/images/kta.png" alt="Logo" onerror="this.src='https://placehold.co/40x40/8B5CF6/white?text=K'">
            <span>Kartners Admin</span>
        </div>
        <a href="/admin/logout" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Deconnexion
        </a>
    </div>
</div>

<div class="admin-nav">
    <ul>
        <li>
            <a href="/admin/dashboard" class="{% if request.path == '/admin/dashboard' %}active{% endif %}">
                <i class="fas fa-tachometer-alt"></i> Tableau de bord
            </a>
        </li>
        <li>
            <a href="/admin/messages" class="{% if request.path == '/admin/messages' %}active{% endif %}">
                <i class="fas fa-envelope"></i> Messages
            </a>
        </li>
        <li>
            <a href="/admin/destinations" class="{% if request.path == '/admin/destinations' %}active{% endif %}">
                <i class="fas fa-plane"></i> Destinations
            </a>
        </li>
        <li>
            <a href="/admin/services" class="{% if request.path == '/admin/services' %}active{% endif %}">
                <i class="fas fa-concierge-bell"></i> Services
            </a>
        </li>
        <li>
            <a href="/admin/bookings" class="{% if request.path == '/admin/bookings' %}active{% endif %}">
                <i class="fas fa-calendar-check"></i> Reservations
            </a>
        </li>
    </ul>
</div>

<div class="admin-content">
    {% block admin_content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
